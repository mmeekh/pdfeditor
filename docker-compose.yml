services:
  pdf-tools-api:
    build:
      context: .
    container_name: pdfeditor-pdf-tools-api-1
    ports:
      - "80:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 5
    # Eğer .env kullanıyorsanız:
    # env_file:
    #   - .env