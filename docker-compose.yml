services:
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - EMAIL=${EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - pdfislemleri_network

  api:
    build: ./app
    restart: unless-stopped
    expose:
      - "2000"
    environment:
      - PYTHONUNBUFFERED=1
      - TEMP_DIR=/app/temp
      - ENVIRONMENT=${ENVIRONMENT}
      - DEBUG=${DEBUG}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CORS_ORIGINS=${CORS_ORIGINS}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:2000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - pdfislemleri_network
    volumes:
      - api_temp:/app/temp
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: '0.8'
        reservations:
          memory: 1G
          cpus: '0.2'

volumes:
  caddy_data:
  caddy_config:
  api_temp:

networks:
  pdfislemleri_network:
    driver: bridge

