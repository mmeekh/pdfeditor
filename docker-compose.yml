# Docker Compose v2 (version alanı opsiyonel)
services:
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - EMAIL=${EMAIL}
    volumes:
      # Host'taki formatlı Caddyfile'ı OKUMA MODUNDA bağla
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Statik siteyi /srv altında read-only sun
      - ./site:/srv:ro
      # Caddy'nin sertifika ve runtime verileri kalıcı
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - pdfislemleri_network
    # API sağlıklıyken başlat (proxy hatalarını azaltır)
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: ./app
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "2000"
    environment:
      - PYTHONUNBUFFERED=1
      - TEMP_DIR=/app/temp
    volumes:
      - api_temp:/app/temp
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:2000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - pdfislemleri_network

volumes:
  caddy_data:
  caddy_config:
  api_temp:

networks:
  pdfislemleri_network:
    driver: bridge
