services:
  caddy:
    image: caddy:2.8
    container_name: pdfeditor-caddy-1
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - EMAIL=${EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD-SHELL", "caddy version >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    pids_limit: 512
    ulimits:
      nproc: 8192
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - pdfislemleri_network
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: pdfeditor-api-1
    restart: unless-stopped
    expose:
      - "2000"
    environment:
      - PYTHONUNBUFFERED=1
      - TEMP_DIR=/app/temp
    volumes:
      - api_temp:/app/temp
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; \
try: urllib.request.urlopen(\"http://localhost:2000/health\", timeout=2); \
sys.exit(0) \
except: sys.exit(1)'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - pdfislemleri_network

volumes:
  caddy_data:
  caddy_config:
  api_temp:

networks:
  pdfislemleri_network:
    driver: bridge
