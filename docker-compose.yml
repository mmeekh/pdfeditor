# Docker Compose v2 syntax - version field is optional

services:
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    environment:
      - EMAIL=${EMAIL}
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
      - ./site:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80 || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
    networks:
      - pdfislemleri_network

  api:
    build: 
      context: ./app
      dockerfile: Dockerfile.dev  # Development Dockerfile kullan
    restart: unless-stopped
    expose:
      - "2000"
    environment:
      - PYTHONUNBUFFERED=1
      - TEMP_DIR=/app/temp
      - ENVIRONMENT=development
      - DEBUG=true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:2000/health"]
      interval: 60s
      timeout: 5s
      retries: 3
    networks:
      - pdfislemleri_network
    volumes:
      - ./app:/app  # Kod değişikliklerini izle
      - api_temp:/app/temp
    ports:
      - "2000:2000"  # API'ye doğrudan erişim için

volumes:
  caddy_data:
  caddy_config:
  api_temp:

networks:
  pdfislemleri_network:
    driver: bridge