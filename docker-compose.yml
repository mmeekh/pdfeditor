version: "3.9"

services:
  pdfislemleri-api:
    build: ./app
    container_name: pdfislemleri-api
    restart: unless-stopped
    networks:
      - web
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  web:
    external: true
