upstream pdf_api {
    server 127.0.0.1:2000;
    keepalive 32;
}

# HTTP'den HTTPS'e yönlendirme
server {
    listen 80;
    server_name _;
    return 301 https://$server_name$request_uri;
}

# HTTPS ana sunucu
server {
    listen 443 ssl http2;
    server_name _;

    # SSL sertifikaları (Let's Encrypt ile alınacak)
    ssl_certificate /etc/letsencrypt/live/pdfislemleri.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pdfislemleri.com/privkey.pem;
    
    # SSL güvenlik ayarları
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Güvenlik başlıkları
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';" always;

    client_max_body_size 100m;

    # Ana uygulama
    location / {
        proxy_pass         http://pdf_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 180;
    }

    # Statik dosyalar - sadece gerekli olanlar
    location /static/ {
        alias /app/static/;
        access_log off;
        expires 7d;
        
        # Güvenlik: Sadece belirli dosya türlerine izin ver
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            add_header Cache-Control "public, max-age=31536000";
        }
        
        # Tehlikeli dosya türlerini engelle
        location ~* \.(py|pyc|log|txt|md|env|conf|ini|yml|yaml|json|xml|sql|db|sqlite|bak|backup)$ {
            deny all;
            return 403;
        }
    }

    # Güvenlik: Gizli dosyaları engelle
    location ~ /\. {
        deny all;
        return 403;
    }
    
    # Güvenlik: Hassas dosyaları engelle
    location ~* \.(env|conf|ini|yml|yaml|log|bak|backup|old|tmp|temp)$ {
        deny all;
        return 403;
    }
}
