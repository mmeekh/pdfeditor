[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
user=root

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/nginx.stdout.log
stderr_logfile=/var/log/supervisor/nginx.stderr.log
stopsignal=QUIT
startsecs=1
user=root

[program:pdf-tools-api]
directory=/app
command=/usr/local/bin/gunicorn app.main:app --chdir /app --bind 0.0.0.0:2000 --workers 2 --worker-class uvicorn.workers.UvicornWorker --timeout 120 --graceful-timeout 30 --log-level info
autostart=true
autorestart=true
startretries=3
priority=20
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/gunicorn.stdout.log
stderr_logfile=/var/log/supervisor/gunicorn.stderr.log
environment=PYTHONUNBUFFERED="1",PYTHONDONTWRITEBYTECODE="1"
user=root

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700
username=root
password=root123

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock
username=root
password=root123

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface
