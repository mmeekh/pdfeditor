[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=100
stdout_logfile=/var/log/nginx/nginx.log
stderr_logfile=/var/log/nginx/nginx_error.log
user=root

[program:pdf-tools-api]
command=gosu appuser gunicorn app.main:app --bind 0.0.0.0:2000 --workers 4 --worker-class uvicorn.workers.UvicornWorker --worker-connections 1000 --max-requests 1000 --max-requests-jitter 100 --timeout 120 --keep-alive 5 --log-level info --access-logfile /var/log/pdf-tools-api/access.log --error-logfile /var/log/pdf-tools-api/error.log --log-format '%%(h)s %%(l)s %%(u)s %%(t)s "%%(r)s" %%(s)s %%(b)s "%%(f)s" "%%(a)s" %%(D)s'
autostart=true
autorestart=true
priority=200
stdout_logfile=/var/log/pdf-tools-api/gunicorn.log
stderr_logfile=/var/log/pdf-tools-api/gunicorn_error.log
user=appuser
environment=ENVIRONMENT=production,PYTHONPATH=/app

[group:pdf-tools]
programs=nginx,pdf-tools-api
priority=999
