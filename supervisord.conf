[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=100
stdout_logfile=/var/log/nginx/nginx.log
stderr_logfile=/var/log/nginx/nginx_error.log
user=root

[program:pdf-tools-api]
command=gunicorn app.main:app --bind 0.0.0.0:2000 --workers 1 --worker-class uvicorn.workers.UvicornWorker --timeout 120 --log-level info
autostart=true
autorestart=true
priority=200
stdout_logfile=/var/log/pdf-tools-api/gunicorn.log
stderr_logfile=/var/log/pdf-tools-api/gunicorn_error.log
user=appuser
environment=ENVIRONMENT=production,PYTHONPATH=/app
startsecs=10
stopwaitsecs=10

[group:pdf-tools]
programs=nginx,pdf-tools-api
priority=999
