[program:pdf-editor-backend]
command=/home/pdfuser/pdfeditor/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --log-level info
directory=/home/pdfuser/pdfeditor
user=pdfuser
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/pdf-editor-backend.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
environment=ENVIRONMENT=production,APP_RATE_LIMIT_PER_MINUTE=60,APP_RATE_LIMIT_PER_HOUR=500,APP_MAX_UPLOAD_MB=50,APP_SUBPROCESS_TIMEOUT=900,APP_MAX_CONCURRENCY=8
stopasgroup=true
killasgroup=true
